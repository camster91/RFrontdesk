# The web build at https://desk.rotmanav.ca/.
#
#   cd deploy && npx wrangler deploy
#
# Needs a Cloudflare API token with Workers edit rights on the account that
# holds the rotmanav.ca zone (CLOUDFLARE_API_TOKEN). See README "On the web".
name = "rotman-desk"
main = "desk-worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  # Its own host, so its storage is its own origin.
  { pattern = "desk.rotmanav.ca", custom_domain = true },
  # The address it first had. The Worker only redirects these to the host above.
  { pattern = "rotmanav.ca/desk*", zone_name = "rotmanav.ca" },
  { pattern = "www.rotmanav.ca/desk*", zone_name = "rotmanav.ca" }
]

[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"
