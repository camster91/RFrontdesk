name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to exact commits (tag in the comment).
permissions:
  contents: read

jobs:
  # Compiles the app into dist\ and uploads that folder unsigned.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch WebView2 assemblies
        shell: pwsh
        run: ./host/fetch-deps.ps1

      # -NoSymbols: the .pdb is for local crash reports, not for the desk zip.
      - name: Build
        shell: pwsh
        run: ./host/build.ps1 -NoSymbols

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rfrontdesk-windows
          path: dist/
          if-no-files-found: error

  # Code signing (Azure Artifact Signing) through the shared workflow in camster91/Rclicker.
  # Only main is signed. Signs RotmanFrontDesk.exe only: the WebView2 DLLs are already
  # signed by Microsoft. Sign-in uses OIDC, so no secret is stored in this repository.
  sign:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: camster91/Rclicker/.github/workflows/sign-windows.yml@main
    with:
      artifact: rfrontdesk-windows
      file-types: exe

  # Packaged after signing: the zip's For IT.txt records the exe's hash and
  # signature, so it has to describe the signed binary. Uses the signed build when
  # signing ran; a failed signing packages nothing.
  package:
    needs: [build, sign]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.sign.outputs.signed == 'true' && 'rfrontdesk-windows-signed' || 'rfrontdesk-windows' }}
          path: dist

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rotman-front-desk
          path: release/*.zip
          if-no-files-found: error
