name: Build

# Builds, tests and packages Rotman Front Desk on a GitHub Windows machine, so
# nobody needs a build computer, and signs it on main (docs/code-signing.md).
# It deploys nothing: the zip is a download on the run page, under Artifacts.

on:
  push:
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to exact commits (tag in the comment).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # Azure sign-in without stored secrets (OIDC), used only for code signing.
    timeout-minutes: 30
    env:
      # The tests drive the Edge that is already on the machine.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install test tools
        run: npm ci --ignore-scripts

      - name: Fetch WebView2 assemblies
        shell: pwsh
        run: ./host/fetch-deps.ps1

      # -NoSymbols: the .pdb is for local crash reports, not for the desk zip.
      - name: Build
        shell: pwsh
        run: |
          ./host/build.ps1 -NoSymbols
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test
        run: node tools/test-all.cjs

      # Code signing (Azure Artifact Signing). Runs only on main and only once the
      # AZURE_* repository variables exist; see docs/code-signing.md. Until then
      # the build still runs and produces an unsigned zip.
      - name: Sign in to Azure (code signing)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign RotmanFrontDesk.exe
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\RotmanFrontDesk.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/RotmanFrontDesk.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne 'Valid') { throw "RotmanFrontDesk.exe signature is $($sig.Status)" }

      # Packaged after signing: the zip's For IT.txt records the exe's hash and
      # signature, so it has to describe the signed binary.
      - name: Package
        shell: pwsh
        run: |
          ./tools/package.ps1 -NoSymbols
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Try the installer from the zip (install, update, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Run($exe, [string[]] $a) {
            $p = Start-Process $exe -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($a -join ' ') exited with $($p.ExitCode)" }
          }
          $unzipped = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive (Get-Item release/*.zip).FullName $unzipped
          $app = Join-Path $unzipped 'Rotman Front Desk'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Rotman Front Desk'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Rotman Front Desk.lnk'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RotmanFrontDesk'

          Run (Join-Path $app 'RotmanFrontDesk.exe') @('--install', '--quiet', '--no-desktop')
          foreach ($f in 'RotmanFrontDesk.exe', 'web\index.html', 'data\backups', 'licenses\WebView2 LICENSE.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "install is missing $f" }
          }
          if (-not (Test-Path $lnk)) { throw 'no Start menu shortcut' }
          if ((Get-ItemProperty $key).InstallLocation -ne $dir) { throw 'no Apps entry' }
          Write-Host 'install: ok'

          New-Item -ItemType Directory -Force (Join-Path $dir 'data\browser') | Out-Null
          Set-Content (Join-Path $dir 'data\browser\marker') 'records'
          Run (Join-Path $app 'RotmanFrontDesk.exe') @('--install', '--quiet', '--no-desktop')
          if (-not (Test-Path (Join-Path $dir 'data\browser\marker'))) { throw 'an update lost the records' }
          Write-Host 'update keeps the records: ok'

          Run (Join-Path $dir 'RotmanFrontDesk.exe') @('--uninstall', '--quiet')
          if (Test-Path (Join-Path $dir 'RotmanFrontDesk.exe')) { throw 'uninstall left the exe' }
          if (Test-Path $lnk) { throw 'uninstall left the shortcut' }
          if (Test-Path $key) { throw 'uninstall left the Apps entry' }
          if (-not (Test-Path (Join-Path $dir 'data\browser\marker'))) { throw 'uninstall deleted the records without being asked' }
          Write-Host 'uninstall keeps the records: ok'

          Run (Join-Path $app 'RotmanFrontDesk.exe') @('--install', '--quiet', '--no-desktop')
          Run (Join-Path $dir 'RotmanFrontDesk.exe') @('--uninstall', '--quiet', '--delete-data')
          if (Test-Path $dir) { throw "uninstall --delete-data left: $((Get-ChildItem $dir -Recurse -Name) -join ', ')" }
          Write-Host 'uninstall --delete-data removes everything: ok'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rotman-front-desk
          path: release/*.zip
          if-no-files-found: error
