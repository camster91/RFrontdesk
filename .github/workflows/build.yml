name: Build Windows app

# Builds, tests and packages Rotman Front Desk on a GitHub Windows machine, so
# nobody needs a build computer. It signs the exe when a certificate has been
# added as a secret (see docs/EDR_AND_SIGNING.md, "Signing on GitHub").
#
# It never deploys or publishes anything by itself:
#   - every run puts the zip on its run page, under Artifacts;
#   - pushing a version tag (v1.2.3) also makes a DRAFT release, which stays
#     hidden until a person presses Publish.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # The tests drive the Edge that is already on the machine.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test tools
        run: npm ci --ignore-scripts

      - name: Fetch WebView2
        shell: pwsh
        run: ./host/fetch-deps.ps1

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Error "Tag must look like v1.2.3, not $env:GITHUB_REF_NAME"; exit 1 }
          (Get-Content host/AssemblyInfo.cs -Raw) -replace '"\d+\.\d+\.\d+\.\d+"', "`"$v.0`"" |
            Set-Content host/AssemblyInfo.cs -NoNewline
          (Get-Content host/FrontDesk.cs -Raw) -replace 'Version = "\d+\.\d+\.\d+"', "Version = `"$v`"" |
            Set-Content host/FrontDesk.cs -NoNewline
          Write-Host "version $v"

      - name: Build, and sign when a certificate is set up
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:PFX_BASE64) {
            if (-not $env:PFX_PASSWORD) { Write-Error "SIGNING_PFX_PASSWORD is not set."; exit 1 }
            $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            try {
              ./host/build.ps1 -NoSymbols -Pfx $pfx -PfxPassword $env:PFX_PASSWORD -AllowUntrustedRoot
            } finally {
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Host "::warning::No signing certificate is set up, so this build is unsigned. See docs/EDR_AND_SIGNING.md."
            ./host/build.ps1 -NoSymbols
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test
        run: node tools/test-all.cjs

      - name: Package
        shell: pwsh
        run: |
          ./tools/package.ps1 -NoSymbols
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Try the installer from the zip (install, update, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Run($exe, [string[]] $a) {
            $p = Start-Process $exe -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($a -join ' ') exited with $($p.ExitCode)" }
          }
          $unzipped = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive (Get-Item release/*.zip).FullName $unzipped
          $app = Join-Path $unzipped 'Rotman Front Desk'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Rotman Front Desk'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Rotman Front Desk.lnk'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RotmanFrontDesk'

          Run (Join-Path $app 'RotmanFrontDesk.exe') @('--install', '--quiet', '--no-desktop')
          foreach ($f in 'RotmanFrontDesk.exe', 'web\index.html', 'data\backups', 'licenses\WebView2 LICENSE.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "install is missing $f" }
          }
          if (-not (Test-Path $lnk)) { throw 'no Start menu shortcut' }
          if ((Get-ItemProperty $key).InstallLocation -ne $dir) { throw 'no Apps entry' }
          Write-Host 'install: ok'

          New-Item -ItemType Directory -Force (Join-Path $dir 'data\browser') | Out-Null
          Set-Content (Join-Path $dir 'data\browser\marker') 'records'
          Run (Join-Path $app 'RotmanFrontDesk.exe') @('--install', '--quiet', '--no-desktop')
          if (-not (Test-Path (Join-Path $dir 'data\browser\marker'))) { throw 'an update lost the records' }
          Write-Host 'update keeps the records: ok'

          Run (Join-Path $dir 'RotmanFrontDesk.exe') @('--uninstall', '--quiet')
          if (Test-Path (Join-Path $dir 'RotmanFrontDesk.exe')) { throw 'uninstall left the exe' }
          if (Test-Path $lnk) { throw 'uninstall left the shortcut' }
          if (Test-Path $key) { throw 'uninstall left the Apps entry' }
          if (-not (Test-Path (Join-Path $dir 'data\browser\marker'))) { throw 'uninstall deleted the records without being asked' }
          Write-Host 'uninstall keeps the records: ok'

          Run (Join-Path $app 'RotmanFrontDesk.exe') @('--install', '--quiet', '--no-desktop')
          Run (Join-Path $dir 'RotmanFrontDesk.exe') @('--uninstall', '--quiet', '--delete-data')
          if (Test-Path $dir) { throw "uninstall --delete-data left: $((Get-ChildItem $dir -Recurse -Name) -join ', ')" }
          Write-Host 'uninstall --delete-data removes everything: ok'

      - uses: actions/upload-artifact@v4
        with:
          name: Rotman-Front-Desk
          path: release/*.zip
          if-no-files-found: error

  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rotman-Front-Desk
          path: release

      - name: Make a draft release (a person publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*.zip
          --repo "$GITHUB_REPOSITORY" --draft --generate-notes
          --title "Rotman Front Desk $GITHUB_REF_NAME"
