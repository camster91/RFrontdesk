name: Build

# Builds, tests and packages RFrontDesk on a GitHub Windows machine, so
# nobody needs a build computer, and signs it on main (docs/code-signing.md).
# Ordinary pushes and pull requests only build, test, sign on main, and upload
# the zip as an artifact. A GitHub release is published only by the guarded,
# manual workflow_dispatch job below; nothing is deployed to a desk.

on:
  push:
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to exact commits (tag in the comment).
permissions:
  contents: read

jobs:
  # Compiles the app into dist\ and uploads that folder unsigned.
  # Every test suite runs here; a failure stops signing and packaging.
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The tests drive the Edge that is already on the machine.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install test tools
        run: npm ci --ignore-scripts

      - name: Fetch WebView2 assemblies
        shell: pwsh
        run: ./host/fetch-deps.ps1

      # -NoSymbols: the .pdb is for local crash reports, not for the desk zip.
      - name: Build
        shell: pwsh
        run: |
          ./host/build.ps1 -NoSymbols
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test
        run: node tools/test-all.cjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rfrontdesk-windows
          path: dist/
          if-no-files-found: error

  # Code signing (Azure Artifact Signing) through the shared workflow in camster91/Rclicker.
  # Only main is signed. Signs RFrontDesk.exe only: the WebView2 DLLs are already
  # signed by Microsoft. Sign-in uses OIDC, so no secret is stored in this repository.
  sign:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: camster91/Rclicker/.github/workflows/sign-windows.yml@main
    with:
      artifact: rfrontdesk-windows
      file-types: exe

  # Packaged after signing: the zip's For IT.txt records the exe's hash and
  # signature, so it has to describe the signed binary. Uses the signed build when
  # signing ran; a failed signing packages nothing.
  package:
    needs: [build, sign]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.sign.outputs.signed == 'true' && 'rfrontdesk-windows-signed' || 'rfrontdesk-windows' }}
          path: dist

      - name: Package
        shell: pwsh
        run: |
          ./tools/package.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Try the installer from the zip (install, update, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Run($exe, [string[]] $a) {
            $p = Start-Process $exe -ArgumentList $a -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$($a -join ' ') exited with $($p.ExitCode)" }
          }
          $unzipped = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive (Get-Item release/*.zip).FullName $unzipped
          $app = Join-Path $unzipped 'RFrontDesk'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\RFrontDesk'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'RFrontDesk.lnk'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\RFrontDesk'

          Run (Join-Path $app 'RFrontDesk.exe') @('--install', '--quiet', '--no-desktop')
          foreach ($f in 'RFrontDesk.exe', 'web\index.html', 'data\backups', 'licenses\WebView2 LICENSE.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "install is missing $f" }
          }
          if (-not (Test-Path $lnk)) { throw 'no Start menu shortcut' }
          if ((Get-ItemProperty $key).InstallLocation -ne $dir) { throw 'no Apps entry' }
          Write-Host 'install: ok'

          New-Item -ItemType Directory -Force (Join-Path $dir 'data\browser') | Out-Null
          Set-Content (Join-Path $dir 'data\browser\marker') 'records'
          Run (Join-Path $app 'RFrontDesk.exe') @('--install', '--quiet', '--no-desktop')
          if (-not (Test-Path (Join-Path $dir 'data\browser\marker'))) { throw 'an update lost the records' }
          Write-Host 'update keeps the records: ok'

          Run (Join-Path $dir 'RFrontDesk.exe') @('--uninstall', '--quiet')
          # The running exe stays (it does not move itself into Temp, which
          # endpoint agents flag); everything else of the app goes.
          if (Test-Path (Join-Path $dir 'web')) { throw 'uninstall left the app files' }
          if (Test-Path $lnk) { throw 'uninstall left the shortcut' }
          if (Test-Path $key) { throw 'uninstall left the Apps entry' }
          if (-not (Test-Path (Join-Path $dir 'data\browser\marker'))) { throw 'uninstall deleted the records without being asked' }
          Write-Host 'uninstall keeps the records: ok'

          Run (Join-Path $app 'RFrontDesk.exe') @('--install', '--quiet', '--no-desktop')
          Run (Join-Path $dir 'RFrontDesk.exe') @('--uninstall', '--quiet', '--delete-data')
          $left = @(Get-ChildItem $dir -Recurse -Name)
          if ($left.Count -ne 1 -or $left[0] -ne 'RFrontDesk.exe') { throw "uninstall --delete-data left: $($left -join ', ')" }
          if (@(Get-ChildItem $env:TEMP -Filter 'RFrontDesk-removed-*' -ErrorAction SilentlyContinue).Count) { throw 'uninstall moved a file into Temp' }
          Write-Host 'uninstall --delete-data removes everything but the running exe: ok'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rfrontdesk
          path: release/*.zip
          if-no-files-found: error

  # MSIX is prepared only from the signed main artifact. The package test
  # workflow exercises a disposable certificate on pull requests; this path
  # uses the same Azure-signed identity as the primary ZIP distribution.
  msix:
    needs: [build, sign]
    if: >-
      needs.build.result == 'success' &&
      needs.sign.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rfrontdesk-windows-signed
          path: dist

      - name: Package MSIX from signed executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\RFrontDesk.exe'
          $sig = Get-AuthenticodeSignature -LiteralPath $exe
          if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate -or -not $sig.TimeStamperCertificate) {
            throw "signed executable readback failed: $($sig.Status)"
          }
          $publisher = $sig.SignerCertificate.GetNameInfo(
            [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($publisher -cne 'Cameron Ashley') { throw "unexpected executable publisher: $publisher" }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "invalid executable version: $version" }
          ./tools/package-msix.ps1 -DistDir dist -OutDir release-msix
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $msix = Get-ChildItem release-msix\RFrontDesk-*.msix | Select-Object -First 1
          if (-not $msix) { throw 'MSIX packaging produced no package' }
          $manifest = [xml](Get-Content (Join-Path $env:GITHUB_WORKSPACE 'build\msix-staging\AppxManifest.xml') -Raw)
          if ($manifest.Package.Identity.Version -ne $version) {
            throw "MSIX version $($manifest.Package.Identity.Version) does not match executable $version"
          }
          if ($manifest.Package.Identity.Publisher -ne $sig.SignerCertificate.Subject) {
            throw 'MSIX manifest publisher does not match the signed executable'
          }
          Write-Host "Prepared MSIX $($msix.Name): version=$version publisher=$publisher"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rfrontdesk-msix
          path: release-msix/*.msix
          if-no-files-found: error

  # Sign the package itself with the same Azure Artifact Signing profile. The
  # reusable workflow checks Valid status, RFC3161 timestamp and exact publisher
  # before uploading rfrontdesk-msix-signed.
  sign_msix:
    needs: msix
    if: needs.msix.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: camster91/Rclicker/.github/workflows/sign-windows.yml@main
    with:
      artifact: rfrontdesk-msix
      file-types: msix

  verify_msix:
    needs: sign_msix
    if: needs.sign_msix.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rfrontdesk-msix-signed
          path: signed-msix

      - name: Verify signed MSIX readback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem signed-msix\RFrontDesk-*.msix | Select-Object -First 1
          if (-not $msix) { throw 'signed MSIX artifact is empty' }
          $sig = Get-AuthenticodeSignature -LiteralPath $msix.FullName
          if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate -or -not $sig.TimeStamperCertificate) {
            throw "MSIX signature readback failed: $($sig.Status)"
          }
          $publisher = $sig.SignerCertificate.GetNameInfo(
            [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($publisher -cne 'Cameron Ashley') { throw "unexpected MSIX publisher: $publisher" }
          $unpacked = Join-Path $env:RUNNER_TEMP 'rfrontdesk-msix-readback'
          Remove-Item $unpacked -Recurse -Force -ErrorAction SilentlyContinue
          $makeAppx = Get-Command makeappx.exe -ErrorAction SilentlyContinue
          if (-not $makeAppx) {
            $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $makeAppx = Get-ChildItem $sdk -Filter makeappx.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\makeappx\.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $makeAppx) { throw 'makeappx.exe was not found for MSIX readback' }
          & $makeAppx.FullName unpack /p $msix.FullName /d $unpacked /o
          if ($LASTEXITCODE -ne 0) { throw 'makeappx failed to unpack the signed MSIX for readback' }
          $manifest = [xml](Get-Content (Join-Path $unpacked 'AppxManifest.xml') -Raw)
          if ($manifest.Package.Identity.Name -ne 'CameronAshley.RFrontDesk') { throw 'MSIX identity name drifted' }
          $exe = Join-Path $unpacked 'RFrontDesk.exe'
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
          if ($manifest.Package.Identity.Version -ne $version) {
            throw "signed MSIX version $($manifest.Package.Identity.Version) does not match payload $version"
          }
          if ($manifest.Package.Identity.Publisher -ne $sig.SignerCertificate.Subject) {
            throw 'signed MSIX manifest publisher drifted from its signature'
          }
          Write-Host "Verified signed MSIX: $($msix.Name), version=$version, publisher=$publisher, timestamped=yes"

  # Publishing is an explicit release action, never a side effect of a push,
  # pull request, or tag. It can run only when a person starts this workflow
  # from main, after the signed package has completed successfully.
  release:
    needs: [build, sign, package]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      needs.sign.result == 'success' &&
      needs.sign.outputs.signed == 'true' &&
      needs.package.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rfrontdesk
          path: release

      - name: Verify the signed 1.1.0 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'release\RFrontDesk-1.1.0.zip'
          if (-not (Test-Path $zip)) { throw "The package job did not produce $zip." }

          $check = Join-Path $env:RUNNER_TEMP 'rfrontdesk-release-check'
          Remove-Item $check -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $check
          $exe = Join-Path $check 'RFrontDesk\RFrontDesk.exe'
          if (-not (Test-Path $exe)) { throw 'The release zip has no RFrontDesk.exe.' }

          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
          if ($version -ne '1.1.0.0') { throw "The package executable is version '$version', not 1.1.0.0." }

          $sig = Get-AuthenticodeSignature $exe
          if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate -or -not $sig.TimeStamperCertificate) {
            throw "The package executable is not a valid timestamped signature: $($sig.Status)."
          }
          $publisher = $sig.SignerCertificate.GetNameInfo(
            [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($publisher -cne 'Cameron Ashley') {
            throw "The package executable is signed by '$publisher', not 'Cameron Ashley'."
          }
          Write-Host "Verified $version signed by $publisher."

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create v1.1.0 release/RFrontDesk-1.1.0.zip `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'RFrontDesk 1.1.0' `
            --notes-file docs/release-notes-1.1.0.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
